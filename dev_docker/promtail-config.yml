server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://itr-loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project

      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

      - target_label: job
        replacement: docker

    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            timestamp: timestamp
            request_id: request_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
            exception_type: exception_type

      - labels:
          level:
          status_code:

      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000000"
          action_on_failure: skip

      - match:
          selector: '{service=~".+"} !~ "^\\s*\\{"'
          stages:
            - regex:
                expression: "^(?P<level>[A-Z]{3,8})[: ]"
            - labels:
                level:
