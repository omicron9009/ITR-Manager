global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["itr-traefik:8080"]

  - job_name: itr-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["itr-backend-api:8000"]
