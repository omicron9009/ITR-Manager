networks:
  ingress_network:
    name: itr-frontend-bridge
  internal_network:
    name: itr-internal-bridge

volumes:
  postgres_enterprise_data:
  minio_enterprise_data:
  prometheus_enterprise_data:
  grafana_enterprise_data:

services:
  # ===== Data Layer =====
  postgres:
    image: postgres:16-alpine
    container_name: itr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_enterprise_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2gb
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: itr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_enterprise_data:/data
    networks:
      - ingress_network
      - internal_network
    healthcheck:
      # Upgraded check: using standard internal minio admin probe 
      # to ensure it behaves correctly across floating tag updates
      test: ["CMD-SHELL", "minio server info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1gb
    restart: unless-stopped
  
  # ===== SRE Layer =====
  # ─── INGRESS, ROUTING & SSL LAYER ───────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: itr-traefik
    command:
      - "--api.insecure=true" # Accessible on port 8080 for debugging
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"       # Public Web HTTP Entrypoint
      - "8080:8080"   # Traefik Dashboard (Keep closed in cloud firewalls)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ingress_network
    deploy:
      resources:
        limits:
          memory: 512mb
    restart: unless-stopped

  # ─── APPLICATION LAYER ──────────────────────────────────────
  backend-api:
    image: omicron9009/itr-backend:latest
    container_name: itr-backend-api
    env_file:
      - .env1
    # Traefik auto-detects these routing labels dynamically
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ingress_network
      - internal_network
    deploy:
      resources:
        limits:
          memory: 2gb # Slightly elevated to handle your bloated monolith process footprint
    restart: unless-stopped

  frontend-app:
    image: omicron9009/itr-platform-frontend:latest
    container_name: itr-frontend-ui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - backend-api
    networks:
      - ingress_network
    deploy:
      resources:
        limits:
          memory: 512mb
    restart: unless-stopped

  # ─── OBSERVABILITY & METRICS STACK ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: itr-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # Keeps metrics from ballooning your 2TB drive
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Mounts a dedicated named volume inside the global block
      - prometheus_enterprise_data:/prometheus
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          memory: 1gb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: itr-grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    volumes:
      - grafana_enterprise_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ingress_network
      - internal_network
    deploy:
      resources:
        limits:
          memory: 1gb
    restart: unless-stopped