networks:
  ingress_network:
    name: itr-frontend-bridge
  internal_network:
    name: itr-internal-bridge



services:
  # ═══════════════════════════════════════════════════════════════
  # DATA LAYER
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: itr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - C:\Users\jadit\Desktop\Me\ITR-Manager-branch\data\postgres:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4gb
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: itr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - C:\Users\jadit\Desktop\Me\ITR-Manager-branch\data\minio:/data
    ports:
      # Expose MinIO API (presigned URLs) and Console (UI) on LAN
      - "9000:9000"
      - "9001:9001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.workpartners.co.in`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    networks:
      - ingress_network
      - internal_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2gb
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # INGRESS, ROUTING & SSL LAYER
  # ═══════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v2.11
    container_name: itr-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ingress_network
      - internal_network
    deploy:
      resources:
        limits:
          memory: 512mb
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # APPLICATION LAYER
  # ═══════════════════════════════════════════════════════════════
  backend-api:
    image: omicron9009/itr-backend:latest
    container_name: itr-backend-api
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.workpartners.co.in`) || PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ingress_network
      - internal_network
    deploy:
      resources:
        limits:
          memory: 4gb
    restart: unless-stopped

  frontend-app:
    image: omicron9009/itr-frontend:latest
    container_name: itr-frontend-ui
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`workpartners.co.in`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend-api
    networks:
      - ingress_network
    deploy:
      resources:
        limits:
          memory: 1gb
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # CLOUDFLARE TUNNEL (exposes services to the internet)
  # ═══════════════════════════════════════════════════════════════
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: itr-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - ingress_network
    depends_on:
      - traefik
    deploy:
      resources:
        limits:
          memory: 256mb
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # OBSERVABILITY & METRICS STACK
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: itr-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - C:\Users\jadit\Desktop\Me\ITR-Manager-branch\data\prometheus:/prometheus
    networks:
      - internal_network
      - ingress_network
    deploy:
      resources:
        limits:
          memory: 2gb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: itr-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    volumes:
      - C:\Users\jadit\Desktop\Me\ITR-Manager-branch\data\grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3050:3000"
    depends_on:
      - prometheus
    networks:
      - ingress_network
      - internal_network
    deploy:
      resources:
        limits:
          memory: 1gb
    restart: unless-stopped